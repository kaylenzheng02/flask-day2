{% extends "base.html" %}
{% block title %}Meet the dogs{% endblock %}
{% block content %}
<h1>Meet the dogs</h1>
<p>Two fictional dogs for our design experiment.</p>
<div class="dogs">
  {% for dog in dogs %}
  <section class="card">
    <span class="dog-icon" aria-hidden="true">🐶</span>
    <h2>{{ dog["name"] }}</h2>
    <p>{{ dog["description"] }}</p>
  </section>
  {% endfor %}
</div>
{% endblock %}
